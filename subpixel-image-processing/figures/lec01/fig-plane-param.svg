<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 100 700 290" font-family="sans-serif" font-size="15" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" context-stroke="#000"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c00"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#080"/></marker>
</defs>
<polygon points="90,340 560,340 640,130 170,130" fill="#eef4ff" stroke="#000"/>
<text x="560" y="365">plan P</text>
<!-- construction M0 -> M0+xU -> M -->
<line x1="190" y1="300" x2="410" y2="300" stroke="#c00" stroke-dasharray="6,4"/>
<line x1="410" y1="300" x2="477" y2="195" stroke="#080" stroke-dasharray="6,4"/>
<line x1="190" y1="300" x2="477" y2="195" stroke="#06c" stroke-width="1.5"/>
<text x="285" y="322" fill="#c00">xU</text>
<text x="455" y="262" fill="#080">yV</text>
<!-- basis vectors -->
<line x1="190" y1="300" x2="288" y2="300" stroke="#c00" stroke-width="3" marker-end="url(#r)"/>
<text x="232" y="284" fill="#c00">U</text>
<line x1="190" y1="300" x2="235" y2="230" stroke="#080" stroke-width="3" marker-end="url(#g)"/>
<text x="200" y="244" fill="#080">V</text>
<circle cx="190" cy="300" r="4"/><text x="150" y="320">M₀</text>
<circle cx="477" cy="195" r="4" fill="#06c"/><text x="470" y="178" text-anchor="end" fill="#06c">M = M₀ + xU + yV</text>
</svg>
